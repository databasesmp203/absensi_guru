      const formatLocalDate = (date = new Date()) => {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');

        return `${yyyy}-${mm}-${dd}`;

      // Formula Haversine Presisi untuk Mengukur Jarak Koordinat dalam Meter
      function calculateDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return Math.round(R * c);
      }

      const LogoSchoolEmblem = ({ className = "w-10 h-10" }) => (

          <path d="M256 16c-18 0-32 20-45 32-16-7-38-6-52 4-13 10-18 31-23 46-17 3-34 16-41 31-7 15-1 38-12 51-10 13-31 18-36 34-6 17 4 37 3 55-1 17-19 33-14 49 5 16 26 22 36 35 11 13 5 36 12 51 7 15 24 28 41 31 5 15 10 36 23 46 14 10 36 11 52 4 13 12 27 32 45 32s32-20 45-32c16 7 38 6 52-4 13-10 18-31 23-46 17-3 34-16 41-31 7-15 1-38 12-51 10-13 31-18 36-34 6-17-4-37-3-55 1-17 19-33 14-49-5-16-26-22-36-35-11-13-5-36-12-51-7-15-24-28-41-31-5-15-10-36-23-46-14-10-36-11-52-4-13-12-27-32-45-32z" fill="#047857"/>

      function App() {
        const { useState, useEffect, useRef, useMemo } = React;

        // Teacher Profile State
        const [userProfile, setUserProfile] = useState(() => {
          const saved = localStorage.getItem('teacher_profile_data_v16');
          const defaultProfile = {
            nama: '',
            nip: '',
            sekolah: KONFIGURASI_SEKOLAH.NAMA_SEKOLAH,
            jabatan: 'Guru Mata Pelajaran',
            statusPNS: 'PNS / ASN / GTY',
            foto: null
          };
          
          if (!saved) return defaultProfile;
          try {
            return { ...defaultProfile, ...JSON.parse(saved) };
          } catch (e) {
            return defaultProfile;
          }
        });

        const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem('teacher_gas_webapp_url') || '');
        const [schedulePin, setSchedulePin] = useState(() => localStorage.getItem('teacher_schedule_pin') || '1234');

        const [dailySchedules, setDailySchedules] = useState(() => {
          const saved = localStorage.getItem('teacher_daily_schedules_v16');
          return saved ? JSON.parse(saved) : {
            1: { dayName: 'Senin', masuk: '07:00', pulang: '15:30', isLibur: false },
            2: { dayName: 'Selasa', masuk: '07:00', pulang: '15:30', isLibur: false },
            3: { dayName: 'Rabu', masuk: '07:00', pulang: '15:30', isLibur: false },
            4: { dayName: 'Kamis', masuk: '07:00', pulang: '15:30', isLibur: false },
            5: { dayName: 'Jumat', masuk: '07:00', pulang: '11:30', isLibur: false },
            6: { dayName: 'Sabtu', masuk: '07:00', pulang: '13:00', isLibur: false },
            0: { dayName: 'Minggu', masuk: '-', pulang: '-', isLibur: true },
            toleransiMenit: 10
          };
        });

        const [attendanceLogs, setAttendanceLogs] = useState(() => {
          const saved = localStorage.getItem('teacher_attendance_logs_v16');
          return saved ? JSON.parse(saved) : [];
        });

        const [activeTab, setActiveTab] = useState('home');
        const [currentTime, setCurrentTime] = useState(new Date());
        const [deviceId, setDeviceId] = useState('');

        const [currentLocation, setCurrentLocation] = useState({ lat: null, lng: null, accuracy: null });
        const [distanceToSchool, setDistanceToSchool] = useState(null);
        const [isGpsLoading, setIsGpsLoading] = useState(false);
        const [gpsError, setGpsError] = useState(null);

        const [selectedMonth, setSelectedMonth] = useState(() => (new Date().getMonth() + 1).toString().padStart(2, '0'));
        const [selectedYear, setSelectedYear] = useState(() => new Date().getFullYear().toString());
        const [displayLimit, setDisplayLimit] = useState(25);

        const [toastMessage, setToastMessage] = useState(null);
        const [isPinModalOpen, setIsPinModalOpen] = useState(false);
        const [enteredPin, setEnteredPin] = useState('');
        const [pinError, setPinError] = useState('');

        const [isEditModalOpen, setIsEditModalOpen] = useState(false);
        const [isScheduleModalOpen, setIsScheduleModalOpen] = useState(false);
        
        const [editFormData, setEditFormData] = useState({ ...userProfile });
        const [editScheduleData, setEditScheduleData] = useState({ ...dailySchedules });

        const [isDinasModalOpen, setIsDinasModalOpen] = useState(false);
        const [dinasType, setDinasType] = useState('datang');
        const [dinasPurpose, setDinasPurpose] = useState('');
        const [dinasLetterNo, setDinasLetterNo] = useState('');
        const [dinasTime, setDinasTime] = useState('');

        const [isAlfaModalOpen, setIsAlfaModalOpen] = useState(false);
        const [alfaReason, setAlfaReason] = useState('');

        const [deleteTargetId, setDeleteTargetId] = useState(null);
        const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
        const [isSyncingCloud, setIsSyncingCloud] = useState(false);

        const [isPreviewPdfModalOpen, setIsPreviewPdfModalOpen] = useState(false);
        const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

        const fileInputRef = useRef(null);

        const showToast = (text, type = 'info') => {
          setToastMessage({ text, type });
          setTimeout(() => setToastMessage(null), 3500);
        };

        useEffect(() => {
          let storedId = localStorage.getItem('android_device_id');
          if (!storedId) {
            storedId = 'ANDR-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('android_device_id', storedId);
          }
          setDeviceId(storedId);

          const timer = setInterval(() => setCurrentTime(new Date()), 1000);
          
          handleGetGpsLocation(true);

          let watchId = null;
          if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
              (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const acc = Math.round(pos.coords.accuracy);

                setCurrentLocation({ lat, lng, accuracy: acc });
                const targetLat = KONFIGURASI_SEKOLAH.LATITUDE;
                const targetLng = KONFIGURASI_SEKOLAH.LONGITUDE;
                const dist = calculateDistance(lat, lng, targetLat, targetLng);
                setDistanceToSchool(dist);
              },
              (err) => {
                console.warn('Auto GPS Watcher Notice:', err);
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 3000 }
            );
          }

          return () => {
            clearInterval(timer);
            if (watchId !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(watchId);
            }
          };
        }, []);

        useEffect(() => {
          localStorage.setItem('teacher_attendance_logs_v16', JSON.stringify(attendanceLogs));
        }, [attendanceLogs]);

        const handleGetGpsLocation = (silent = false) => {
          return new Promise((resolve) => {
            setIsGpsLoading(true);
            setGpsError(null);

            if (!navigator.geolocation) {
              const errMsg = 'Perangkat tidak mendukung Geolocation GPS.';
              setGpsError(errMsg);
              setIsGpsLoading(false);
              if (!silent) showToast(errMsg, 'error');
              resolve({ success: false, message: errMsg });
              return;
            }

            const targetLat = KONFIGURASI_SEKOLAH.LATITUDE;
            const targetLng = KONFIGURASI_SEKOLAH.LONGITUDE;

            const onGpsSuccess = (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              const acc = Math.round(pos.coords.accuracy);

              const locationData = { lat, lng, accuracy: acc };
              setCurrentLocation(locationData);
              
              const dist = calculateDistance(lat, lng, targetLat, targetLng);
              setDistanceToSchool(dist);
              setIsGpsLoading(false);

              if (!silent) {
                showToast(`GPS Terkunci! Jarak ke sekolah: ${dist}m (Akurasi: ±${acc}m)`);
              }
              resolve({ success: true, locationData, dist });
            };

            navigator.geolocation.getCurrentPosition(
              onGpsSuccess,
              (err) => {
                navigator.geolocation.getCurrentPosition(
                  onGpsSuccess,
                  (finalErr) => {
                    setIsGpsLoading(false);
                    let errMsg = 'Gagal mengunci lokasi GPS. Aktifkan Lokasi/GPS HP!';
                    if (finalErr.code === 1) errMsg = 'Izin lokasi GPS ditolak oleh perangkat.';
                    else if (finalErr.code === 2) errMsg = 'Sinyal GPS tidak tersedia.';
                    else if (finalErr.code === 3) errMsg = 'Waktu pencarian GPS habis (Timeout).';

                    setGpsError(errMsg);
                    if (!silent) showToast(errMsg, 'error');
                    resolve({ success: false, message: errMsg });
                  },
                  { enableHighAccuracy: false, timeout: 4000, maximumAge: 10000 }
                );
              },
              { enableHighAccuracy: true, timeout: 5000, maximumAge: 5000 }
            );
          });
        };

        const syncWithCloud = async (actionType, payloadData = null) => {
          if (!webAppUrl) return;
          setIsSyncingCloud(true);
          try {
            const targetNip = (payloadData && payloadData.nip) || (payloadData && payloadData.profile && payloadData.profile.nip) || userProfile.nip;
            const targetNama = (payloadData && payloadData.namaGuru) || (payloadData && payloadData.profile && payloadData.profile.nama) || userProfile.nama;

            const bodyPayload = {
              action: actionType,
              nip: targetNip,
              deviceId: deviceId,
              namaGuru: targetNama,
              data: payloadData || {
                profile: { ...userProfile, deviceId },
                schedules: dailySchedules,
                logs: attendanceLogs
              }
            };

            const response = await fetch(webAppUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(bodyPayload)
            });

            const result = await response.json();
            if (result.status === 'success') {
              showToast(result.message || 'Tersimpan otomatis ke Cloud Google Sheets!');
              return true;
            } else if (result.status === 'error') {
              showToast(result.message || 'Gagal tersinkron ke Cloud', 'error');
              return false;
            }
          } catch (e) {
            console.warn('Sync Cloud Warning:', e);
            return false;
          } finally {
            setIsSyncingCloud(false);
          }
        };

        const pullDataFromCloud = async () => {
          if (!webAppUrl) {
            showToast('Masukkan URL Web App Google Script terlebih dahulu!', 'error');
            return;
          }
          setIsSyncingCloud(true);
          try {
            const res = await fetch(`${webAppUrl}?action=getAllData&nip=${encodeURIComponent(userProfile.nip)}&deviceId=${encodeURIComponent(deviceId)}`);
            const result = await res.json();
            if (result.status === 'success' && result.data) {
              if (result.data.profile) setUserProfile(prev => ({ ...prev, ...result.data.profile }));
              if (result.data.schedules) setDailySchedules(result.data.schedules);
              if (result.data.logs && Array.isArray(result.data.logs)) setAttendanceLogs(result.data.logs);
              showToast('Data berhasil diperbarui dari Cloud!');
            } else {
              showToast(result.message || 'Gagal menarik data dari Google Sheets.', 'error');
            }
          } catch (err) {
            showToast('Gagal terhubung ke server Google Sheets.', 'error');
          } finally {
            setIsSyncingCloud(false);
          }
        };

        const todayIndex = currentTime.getDay();
        const todaySchedule = dailySchedules[todayIndex] || { dayName: 'Hari Ini', masuk: '07:00', pulang: '15:30', isLibur: false };
        const todayStr = formatLocalDate(currentTime);

        const todayLogs = useMemo(() => {
          return attendanceLogs.filter(l => l.tanggal === todayStr);
        }, [attendanceLogs, todayStr]);

        const todayAbsensi = useMemo(() => {
          return {
            datang: todayLogs.find(l => l.tipe === 'Kedatangan')?.datang || null,
            pulang: todayLogs.find(l => l.tipe === 'Kepulangan')?.pulang || null,
            dinasDatang: todayLogs.find(l => l.tipe === 'Dinas Kedatangan')?.datang || null,
            dinasPulang: todayLogs.find(l => l.tipe === 'Dinas Kepulangan')?.pulang || null,
            alfa: todayLogs.find(l => l.tipe === 'Alfa')?.keterangan || null,
            statusDatang: todayLogs.find(l => l.tipe === 'Kedatangan')?.status || null,
            statusPulang: todayLogs.find(l => l.tipe === 'Kepulangan')?.status || null
          };
        }, [todayLogs]);

        const filteredLogs = useMemo(() => {
          return attendanceLogs.filter(log => {
            if (!log.tanggal) return false;
            const [y, m] = log.tanggal.split('-');
            return y === selectedYear && m === selectedMonth;
          });
        }, [attendanceLogs, selectedMonth, selectedYear]);

        const stats = useMemo(() => {
          let hadir = 0, terlambat = 0, dinas = 0, alfa = 0;
          for (let i = 0; i < filteredLogs.length; i++) {
            const l = filteredLogs[i];
            const status = l.status || '';
            const tipe = l.tipe || '';
            if (status.includes('Tepat') || status.includes('Terlambat')) hadir++;
            if (status.includes('Terlambat')) terlambat++;
            if (status.includes('Dinas') || tipe.includes('Dinas')) dinas++;
            if (status.includes('Alfa') || tipe.includes('Alfa')) alfa++;
          }
          return { totalHadir: hadir, totalTerlambat: terlambat, totalDinas: dinas, totalAlfa: alfa };
        }, [filteredLogs]);

        const displayedLogs = useMemo(() => {
          return filteredLogs.slice(0, displayLimit);
        }, [filteredLogs, displayLimit]);

        const checkTimeStatus = (type) => {
          if (todaySchedule.isLibur) return { status: 'Hari Libur' };

          const nowH = currentTime.getHours();
          const nowM = currentTime.getMinutes();
          const totalMin = nowH * 60 + nowM;

          if (type === 'datang') {
            const [targetH, targetM] = todaySchedule.masuk.split(':').map(Number);
            const targetMin = targetH * 60 + targetM + Number(dailySchedules.toleransiMenit || 0);

            if (totalMin > targetMin) {
              const diff = totalMin - targetMin;
              return { status: `Terlambat (${diff}m)` };
            }
            return { status: 'Tepat Waktu' };
          }

          if (type === 'pulang') {
            const [targetH, targetM] = todaySchedule.pulang.split(':').map(Number);
            const targetMin = targetH * 60 + targetM;

            if (totalMin < targetMin) {
              const diff = targetMin - totalMin;
              return { status: `Pulang Cepat (${diff}m)` };
            }
            return { status: 'Sesuai Jadwal' };
          }

          return { status: 'Tercatat' };
        };

        const handleInstantClickAbsen = async (type) => {
          if (todaySchedule.isLibur) {

          if (!userProfile.nip || !userProfile.nama) {
            showToast('Lengkapi Nama dan NIP Anda di menu Profil terlebih dahulu!', 'error');
            setActiveTab('profile');
            return;
          }

          showToast('Mengaktifkan & mengunci lokasi GPS terbaru...', 'info');
          const gpsRes = await handleGetGpsLocation(true);

          const todayStr = formatLocalDate(currentTime);

          let locText = 'GPS Tidak Aktif / Gagal Mengunci';
          let mapsUrl = '';

          const namaSekolahAktif = userProfile.sekolah || KONFIGURASI_SEKOLAH.NAMA_SEKOLAH;
          const maxRadius = KONFIGURASI_SEKOLAH.RADIUS_MAX_METER;

          if (gpsRes.success && gpsRes.locationData && gpsRes.locationData.lat) {
            const distVal = gpsRes.dist !== null ? gpsRes.dist : distanceToSchool;
            const distStr = distVal !== null ? ` (${distVal}m)` : '';
            
            locText = `${namaSekolahAktif}${distStr} [${gpsRes.locationData.lat.toFixed(4)}, ${gpsRes.locationData.lng.toFixed(4)}]`;

            showToast(gpsRes.message || 'Presensi dicatat, namun lokasi GPS belum terkunci.', 'error');
          }

          if (type === 'datang') {

            const newLog = {
              id: Date.now(),
              nip: userProfile.nip,
              namaGuru: userProfile.nama,
              tanggal: todayStr,
              datang: nowStr,
              pulang: '-',
              tipe: 'Kedatangan',
              status: statusObj.status,
              lokasi: locText,
              mapsUrl: mapsUrl,
              keterangan: `Presensi ${todaySchedule.dayName} (${todaySchedule.masuk} WIB)`
            };

            setAttendanceLogs(prev => [newLog, ...prev]);
            showToast(`Absen Kedatangan Jam ${nowStr} (${statusObj.status})`);

            const newLog = {
              id: Date.now(),
              nip: userProfile.nip,
              namaGuru: userProfile.nama,
              tanggal: todayStr,
              datang: todayAbsensi.datang || '-',
              pulang: nowStr,
              tipe: 'Kepulangan',
              status: statusObj.status,
              lokasi: locText,
              mapsUrl: mapsUrl,
              keterangan: `Presensi Kepulangan ${todaySchedule.dayName} (${todaySchedule.pulang} WIB)`
            };

            setAttendanceLogs(prev => [newLog, ...prev]);
            showToast(`Absen Kepulangan Jam ${nowStr} (${statusObj.status})`);
            syncWithCloud('saveAttendance', newLog);
          }
        };

          const targetType = type || (!todayAbsensi.dinasDatang ? 'datang' : 'pulang');
          setDinasType(targetType);
          setDinasTime(nowStr);

          handleGetGpsLocation(true);

          const existingDinas = attendanceLogs.find(l => l.tanggal === todayStr && (l.tipe === 'Dinas Kedatangan' || l.tipe === 'Dinas Luar'));
          if (existingDinas && existingDinas.keterangan) {

            if (match) {

        const handleSubmitDinas = async (e) => {

          const gpsRes = await handleGetGpsLocation(true);

          const timeStr = dinasTime || formatLocalTime(currentTime);

          const namaSekolahAktif = userProfile.sekolah || KONFIGURASI_SEKOLAH.NAMA_SEKOLAH;

            locText = `${namaSekolahAktif}${distStr} [${gpsRes.locationData.lat.toFixed(4)}, ${gpsRes.locationData.lng.toFixed(4)}]`;
            mapsUrl = `https://www.google.com/maps?q=${gpsRes.locationData.lat},${gpsRes.locationData.lng}`;

          const newLog = {
            id: Date.now(),
            nip: userProfile.nip,
            namaGuru: userProfile.nama,
            tanggal: todayStr,
            datang: dinasType === 'datang' ? timeStr : (todayAbsensi.dinasDatang || '-'),
            pulang: dinasType === 'pulang' ? timeStr : '-',
            tipe: tipeFix,
            status: 'Dinas Luar',
            lokasi: locText,
            mapsUrl: mapsUrl,
            keterangan: `Dinas: ${dinasPurpose.trim()}${stText}`
          };

          setAttendanceLogs(prev => [newLog, ...prev]);
          showToast(`Presensi ${tipeFix} Jam ${timeStr} tersimpan!`);
          syncWithCloud('saveAttendance', newLog);
          setIsDinasModalOpen(false);
        };

        const handleOpenAlfaModal = () => {
          setAlfaReason('');
          handleGetGpsLocation(true);

        const handleSubmitAlfa = async (e) => {

          let mapsUrl = '';
          if (gpsRes.success && gpsRes.locationData && gpsRes.locationData.lat) {
            locText = `${gpsRes.locationData.lat.toFixed(4)}, ${gpsRes.locationData.lng.toFixed(4)}`;
            mapsUrl = `https://www.google.com/maps?q=${gpsRes.locationData.lat},${gpsRes.locationData.lng}`;
          }

          const keteranganFix = alfaReason.trim() ? `Alfa: ${alfaReason.trim()}` : 'Tanpa Keterangan (Alfa)';

          const newLog = {
            id: Date.now(),
            nip: userProfile.nip,
            namaGuru: userProfile.nama,
            tanggal: todayStr,
            datang: '-',
            pulang: '-',
            tipe: 'Alfa',
            status: 'Alfa (Tanpa Keterangan)',
            lokasi: locText,
            mapsUrl: mapsUrl,
            keterangan: keteranganFix
          };

          setAttendanceLogs(prev => [newLog, ...prev]);
          showToast('Catatan Alfa tersimpan!', 'info');
          syncWithCloud('saveAttendance', newLog);
          setIsAlfaModalOpen(false);
        };

        const handleExecuteDeleteLog = () => {
          if (!deleteTargetId) return;
          setAttendanceLogs(prev => prev.filter(l => l.id !== deleteTargetId));
          syncWithCloud('deleteAttendance', { id: deleteTargetId });
          setDeleteTargetId(null);
          showToast('Catatan presensi berhasil dihapus!');
        };

        const handleOpenPdfPreview = () => {
          setIsPreviewPdfModalOpen(true);
        };

        const handleDownloadPdfFile = () => {
          const element = document.getElementById('pdf-printable-content');
          if (!element) return;

          setIsGeneratingPdf(true);
          showToast('Memproses file PDF A4...', 'info');

          const monthNames = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
          const monthNum = parseInt(selectedMonth, 10);
          const monthText = monthNames[monthNum] || selectedMonth;
          const namaSanitized = (userProfile.nama || 'Guru').replace(/[^a-zA-Z0-9]/g, '_');
          const fileName = `Laporan_Absensi_SMPITNU_${namaSanitized}_${monthText}_${selectedYear}.pdf`;

          const opt = {
            margin: [8, 8, 8, 8],
            filename: fileName,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: {
              scale: 2,
              useCORS: true,
              allowTaint: true,
              backgroundColor: '#ffffff',
              scrollX: 0,
              scrollY: 0,
              windowWidth: 794,
              logging: false,
              onclone: (clonedDoc) => {
                const el = clonedDoc.getElementById('pdf-printable-content');
                if (el) {
                  el.style.width = '700px';
                  el.style.margin = '0 auto';
                  el.style.padding = '20px 24px';
                  el.style.boxShadow = 'none';
                  el.style.borderRadius = '0';
                  el.style.border = 'none';
                  el.style.background = '#ffffff';
                }
              }
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
          };

          html2pdf().set(opt).from(element).output('datauristring').then((dataUri) => {
            setIsGeneratingPdf(false);
            
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString("PDF_SAVE:" + fileName + "|||" + dataUri);
            } else {
              try {
                const downloadLink = document.createElement('a');
                downloadLink.href = dataUri;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
              } catch (e) {
                console.warn('Fallback browser download link:', e);
              }
            }
            showToast('PDF berhasil diunduh!');
          }).catch((err) => {
            setIsGeneratingPdf(false);
            console.error('PDF Generation Error:', err);
            showToast('Gagal memproses PDF.', 'error');
          });
        };

        const handleImageUpload = (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            showToast('Memproses & mengompresi foto...', 'info');
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const MAX_WIDTH = 300;
                const MAX_HEIGHT = 300;

                if (width > height) {
                  if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                  }
                } else {
                  if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                setEditFormData(prev => ({ ...prev, foto: compressedBase64 }));
                showToast('Foto profil berhasil diunggah!');
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        };

        const handleSaveProfileSubmit = async (e) => {
          e.preventDefault();

          if (webAppUrl && editFormData.nip) {
            setIsSyncingCloud(true);
            showToast('Memverifikasi NIP dan Perangkat ke Cloud...', 'info');
            try {
              const bodyPayload = {
                action: 'saveProfile',
                nip: editFormData.nip,
                deviceId: deviceId,
                namaGuru: editFormData.nama,
                data: { ...editFormData, deviceId }
              };

              const response = await fetch(webAppUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(bodyPayload)
              });

              const result = await response.json();
              if (result.status === 'error') {
                showToast(result.message || 'NIP ini sudah terdaftar di HP lain!', 'error');
                setIsSyncingCloud(false);
                return;
              }
            } catch (err) {
              console.warn('Verifikasi Cloud Warning:', err);
            } finally {
              setIsSyncingCloud(false);
            }
          }

          setUserProfile(editFormData);
          localStorage.setItem('teacher_profile_data_v16', JSON.stringify(editFormData));
          setIsEditModalOpen(false);
          showToast('Profil Guru berhasil disimpan & terikat pada HP ini!');
        };

        const handleVerifyPinAndOpenSchedule = (e) => {
          e.preventDefault();
          if (enteredPin === schedulePin) {

            setEditScheduleData({ ...dailySchedules });
            setIsScheduleModalOpen(true);
          } else {

          }

          setIsScheduleModalOpen(false);
          showToast('Jadwal operasional berhasil diperbarui!');
          syncWithCloud('saveSchedule', editScheduleData);
        };

        const maxRadiusActive = KONFIGURASI_SEKOLAH.RADIUS_MAX_METER;
        const isWithinRadius = distanceToSchool !== null && distanceToSchool <= maxRadiusActive;

        return (
          <div className="flex flex-col min-h-screen bg-slate-100 font-sans max-w-md mx-auto shadow-2xl relative border-x border-slate-200">
            
            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-xs bg-emerald-950 text-white text-xs px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 border border-emerald-700">
                <IconZap className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                <span className="font-medium">{toastMessage.text}</span>
              </div>
            )}

            <div className="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-700 text-white p-5 rounded-b-3xl shadow-lg relative no-print">

                    {userProfile.foto ? (
                      <img

                    ) : (
                      <LogoSchoolEmblem className="w-9 h-9" />
                    )}

                  >
                    <IconEdit className="w-3.5 h-3.5" /> Edit Profil
                  </button>
                  <span className="text-[10px] font-semibold text-emerald-200 bg-black/20 px-2 py-0.5 rounded-md flex items-center gap-1 border border-emerald-500/30">

                  </span>

                <div className="truncate">

                  <IconShield className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                  <div>
                    <p className="font-bold mb-0.5">Lengkapi Profil Guru Anda</p>
                    <p className="text-[11px] text-amber-700">Isi Nama Lengkap dan NIP/NUPTK di menu Profil agar presensi dan laporan PDF SMP IT NU Asshofiyah tercatat secara resmi.</p>
                  </div>
                </div>
              )}

              {/* TAB ABSENSI UTAMA */}
              {activeTab === 'home' && (
                <div className="space-y-4">
