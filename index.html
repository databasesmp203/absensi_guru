                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 text-center relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-600 to-teal-500"></div>
                    <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                      {currentTime.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                    </p>
                    <div className="text-3xl font-extrabold text-slate-800 my-1 tracking-tight font-mono">
                      {formatLocalTime(currentTime)}
                    </div>

                    <div className="mt-2 pt-2.5 border-t border-slate-100 flex flex-col gap-2">
                      <div className="flex justify-between items-center text-left text-[11px]">
                        <div>
                          <p className="font-bold flex items-center gap-1 text-emerald-900">
                            <IconMapPin className="w-3.5 h-3.5 text-emerald-600" /> {KONFIGURASI_SEKOLAH.NAMA_SEKOLAH}
                          </p>
                          <p className="text-[10px] text-slate-400 font-mono">
                            Target GPS: {KONFIGURASI_SEKOLAH.LATITUDE}, {KONFIGURASI_SEKOLAH.LONGITUDE} (Max {maxRadiusActive}m)
                          </p>
                        </div>
                      </div>

                      <div className="bg-emerald-50/50 p-2.5 rounded-xl border border-emerald-200/60 flex justify-between items-center text-xs">
                        <div className="text-left font-mono text-[10px]">
                          {currentLocation.lat ? (
                            <div>
                              <p className="text-slate-700 font-sans font-bold text-[11px] flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping inline-block"></span>
                                Posisi HP: {currentLocation.lat.toFixed(4)}, {currentLocation.lng.toFixed(4)}
                              </p>
                              <p className="text-slate-500">
                                Jarak: <strong className={isWithinRadius ? 'text-emerald-700' : 'text-amber-700'}>
                                  {distanceToSchool !== null ? `${distanceToSchool} meter` : 'Mengukur...'}
                                </strong>
                                {currentLocation.accuracy && ` (Akurasi ±${currentLocation.accuracy}m)`}
                              </p>
                            </div>
                          ) : (
                            <p className="text-amber-600 italic flex items-center gap-1">
                              <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse inline-block"></span>
                              GPS Mengunci Lokasi HP...
                            </p>
                          )}
                        </div>

                        <button
                          onClick={() => handleGetGpsLocation(false)}
                          disabled={isGpsLoading}
                          className="text-[9px] bg-emerald-700 text-white border border-emerald-800 hover:bg-emerald-800 font-bold px-2 py-1 rounded-lg flex items-center gap-1 shadow-sm"
                        >
                          <IconRefresh className={`w-3 h-3 ${isGpsLoading ? 'animate-spin' : ''}`} /> Fast GPS
                        </button>
                      </div>

                      {distanceToSchool !== null && (
                        <div className={`p-1.5 rounded-lg text-[10px] font-bold text-center flex items-center justify-center gap-1.5 ${
                          isWithinRadius ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-amber-100 text-amber-900 border border-amber-300'
                        }`}>
                          <IconMapPin className="w-3.5 h-3.5" />
                          {isWithinRadius 
                            ? `Status: DALAM RADIUS SEKOLAH (${distanceToSchool}m <= ${maxRadiusActive}m)` 
                            : `Status: LUAR RADIUS SEKOLAH (${distanceToSchool}m > ${maxRadiusActive}m)`}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Jadwal Operasional SMP IT NU Asshofiyah */}
                  <div className="bg-gradient-to-br from-emerald-950 via-emerald-900 to-slate-900 text-white rounded-2xl p-4 shadow-md relative overflow-hidden">
                    <div className="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
                      <div className="flex items-center gap-2">
                        <IconCalendar className="w-4 h-4 text-emerald-400" />
                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-100">
                          Jadwal Operasional ({todaySchedule.dayName})
                        </span>
                      </div>
                      <button
                        onClick={() => { setEnteredPin(''); setPinError(''); setIsPinModalOpen(true); }}
                        className="text-[11px] bg-white/10 text-emerald-200 px-2.5 py-1 rounded-lg flex items-center gap-1 border border-white/10"
                      >
                        <IconLock className="w-3 h-3 text-emerald-300" /> Atur Jam
                      </button>
                    </div>

                    {!todaySchedule.isLibur ? (
                      <div className="grid grid-cols-2 gap-3 text-center">
                        <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 border border-white/10">
                          <p className="text-[10px] text-emerald-200 uppercase font-semibold">Batas Masuk</p>
                          <p className="text-lg font-extrabold text-emerald-300 font-mono">{todaySchedule.masuk} <span className="text-xs font-normal">WIB</span></p>
                        </div>
                        <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 border border-white/10">
                          <p className="text-[10px] text-emerald-200 uppercase font-semibold">Jam Pulang</p>
                          <p className="text-lg font-extrabold text-amber-300 font-mono">{todaySchedule.pulang} <span className="text-xs font-normal">WIB</span></p>
                        </div>
                      </div>
                    ) : (
                      <div className="text-center py-2 text-amber-300 font-bold text-xs">
                        Hari ini adalah Hari Libur Operasional.
                      </div>
                    )}
                  </div>

                  {/* Resume Status Hari Ini */}
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <h2 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">Status Absensi Hari Ini</h2>
                    <div className="grid grid-cols-2 gap-2 text-center sm:grid-cols-5">
                      <div className={`p-2 rounded-xl border ${todayAbsensi.datang ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <p className="text-[9px] uppercase font-semibold">Datang Sekolah</p>
                        <p className="text-xs font-bold my-0.5 font-mono">{todayAbsensi.datang || '--:--'}</p>
                        <span className="text-[8px] px-1.5 py-0.5 rounded font-semibold bg-emerald-100 text-emerald-800">
                          {todayAbsensi.statusDatang || (todayAbsensi.datang ? 'Tercatat' : 'Belum')}
                        </span>
                      </div>

                      <div className={`p-2 rounded-xl border ${todayAbsensi.pulang ? 'bg-teal-50 border-teal-200 text-teal-900' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <p className="text-[9px] uppercase font-semibold">Pulang Sekolah</p>
                        <p className="text-xs font-bold my-0.5 font-mono">{todayAbsensi.pulang || '--:--'}</p>
                        <span className="text-[8px] px-1.5 py-0.5 rounded font-semibold bg-teal-100 text-teal-800">
                          {todayAbsensi.statusPulang || (todayAbsensi.pulang ? 'Tercatat' : 'Belum')}
                        </span>
                      </div>

                      <div className={`p-2 rounded-xl border ${todayAbsensi.dinasDatang ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <p className="text-[9px] uppercase font-semibold">Dinas Datang</p>
                        <p className="text-xs font-bold my-0.5 font-mono">{todayAbsensi.dinasDatang || '--:--'}</p>
                        <span className="text-[8px] px-1.5 py-0.5 rounded font-semibold bg-amber-100 text-amber-800">
                          {todayAbsensi.dinasDatang ? 'Tercatat' : 'Belum'}
                        </span>
                      </div>

                      <div className={`p-2 rounded-xl border ${todayAbsensi.dinasPulang ? 'bg-orange-50 border-orange-200 text-orange-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <p className="text-[9px] uppercase font-semibold">Dinas Pulang</p>
                        <p className="text-xs font-bold my-0.5 font-mono">{todayAbsensi.dinasPulang || '--:--'}</p>
                        <span className="text-[8px] px-1.5 py-0.5 rounded font-semibold bg-orange-100 text-orange-800">
                          {todayAbsensi.dinasPulang ? 'Tercatat' : 'Belum'}
                        </span>
                      </div>

                      <div className={`p-2 rounded-xl border col-span-2 sm:col-span-1 ${todayAbsensi.alfa ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <p className="text-[9px] uppercase font-semibold">Status Alfa</p>
                        <p className="text-xs font-bold my-0.5 truncate">{todayAbsensi.alfa ? 'Tercatat' : '--:--'}</p>
                        <span className="text-[8px] px-1.5 py-0.5 rounded font-semibold bg-rose-100 text-rose-800">
                          {todayAbsensi.alfa ? 'Alfa' : 'Nihil'}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Tombol Klik Instant Presensi */}
                  <div className="space-y-3">
                    <p className="text-xs font-bold text-slate-600 uppercase tracking-wider">Tombol Absensi Instant</p>
                    
                    <button
                      onClick={() => handleInstantClickAbsen('datang')}
                      disabled={!!todayAbsensi.datang || !!todayAbsensi.alfa || todaySchedule.isLibur || isGpsLoading}
                      className={`w-full p-4 rounded-2xl flex items-center justify-between text-white transition-all shadow-md ${
                        todayAbsensi.datang || todayAbsensi.alfa || todaySchedule.isLibur || isGpsLoading
                          ? 'bg-slate-300 cursor-not-allowed shadow-none' 
                          : 'bg-gradient-to-r from-emerald-700 to-teal-700 active:scale-95 hover:shadow-lg'
                      }`}
                    >
                      <div className="text-left flex items-center gap-3">
                        <IconClock className="w-8 h-8 opacity-80" />
                        <div>
                          <p className="font-extrabold text-base">KLIK KEDATANGAN</p>
                          <p className="text-xs text-emerald-100">
                            {todaySchedule.isLibur ? 'Hari Libur' : `Batas: Jam ${todaySchedule.masuk} WIB`}
                          </p>
                        </div>
                      </div>
                      <span className="bg-white text-emerald-900 text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm">
                        {isGpsLoading ? 'MENGUNCI GPS...' : (todayAbsensi.datang ? 'SUDAH' : 'KLIK')}
                      </span>
                    </button>

                    <button
                      onClick={() => handleInstantClickAbsen('pulang')}
                      disabled={!todayAbsensi.datang || !!todayAbsensi.pulang || !!todayAbsensi.alfa || todaySchedule.isLibur || isGpsLoading}
                      className={`w-full p-4 rounded-2xl flex items-center justify-between text-white transition-all shadow-md ${
                        !todayAbsensi.datang || todayAbsensi.pulang || todayAbsensi.alfa || todaySchedule.isLibur || isGpsLoading
                          ? 'bg-slate-300 cursor-not-allowed shadow-none' 
                          : 'bg-gradient-to-r from-teal-700 to-emerald-900 active:scale-95 hover:shadow-lg'
                      }`}
                    >
                      <div className="text-left flex items-center gap-3">
                        <IconClock className="w-8 h-8 opacity-80" />
                        <div>
                          <p className="font-extrabold text-base">KLIK KEPULANGAN</p>
                          <p className="text-xs text-teal-100">
                            {todaySchedule.isLibur ? 'Hari Libur' : `Mulai: Jam ${todaySchedule.pulang} WIB`}
                          </p>
                        </div>
                      </div>
                      <span className="bg-white text-teal-900 text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm">
                        {isGpsLoading ? 'MENGUNCI GPS...' : (todayAbsensi.pulang ? 'SUDAH' : 'KLIK')}
                      </span>
                    </button>

                    {/* Tombol Dinas Luar */}
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => handleOpenDinasModal('datang')}
                        disabled={!!todayAbsensi.dinasDatang || !!todayAbsensi.alfa || todaySchedule.isLibur}
                        className={`p-3.5 rounded-2xl flex items-center justify-between text-white shadow-md transition-all ${
                          todayAbsensi.dinasDatang || todayAbsensi.alfa || todaySchedule.isLibur ? 'bg-slate-300 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-amber-600 to-amber-700 active:scale-95'
                        }`}
                      >
                        <div className="text-left flex items-center gap-2">
                          <IconBriefcase className="w-6 h-6 opacity-80" />
                          <div>
                            <p className="font-extrabold text-xs">DINAS DATANG</p>
                            <p className="text-[10px] text-amber-100">{todayAbsensi.dinasDatang ? todayAbsensi.dinasDatang : 'Klik Datang'}</p>
                          </div>
                        </div>
                      </button>

                      <button
                        onClick={() => handleOpenDinasModal('pulang')}
                        disabled={!todayAbsensi.dinasDatang || !!todayAbsensi.dinasPulang || !!todayAbsensi.alfa || todaySchedule.isLibur}
                        className={`p-3.5 rounded-2xl flex items-center justify-between text-white shadow-md transition-all ${
                          !todayAbsensi.dinasDatang || todayAbsensi.dinasPulang || todayAbsensi.alfa || todaySchedule.isLibur ? 'bg-slate-300 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-orange-600 to-amber-700 active:scale-95'
                        }`}
                      >
                        <div className="text-left flex items-center gap-2">
                          <IconBriefcase className="w-6 h-6 opacity-80" />
                          <div>
                            <p className="font-extrabold text-xs">DINAS PULANG</p>
                            <p className="text-[10px] text-orange-100">{todayAbsensi.dinasPulang ? todayAbsensi.dinasPulang : 'Klik Pulang'}</p>
                          </div>
                        </div>
                      </button>
                    </div>

                    {/* Tombol Catat Alfa */}
                    <button
                      onClick={handleOpenAlfaModal}
                      disabled={!!todayAbsensi.alfa || !!todayAbsensi.datang || todaySchedule.isLibur}
                      className={`w-full p-3.5 rounded-2xl flex items-center justify-between text-white transition-all shadow-md ${
                        todayAbsensi.alfa || todayAbsensi.datang || todaySchedule.isLibur
                          ? 'bg-slate-300 cursor-not-allowed shadow-none'
                          : 'bg-gradient-to-r from-rose-700 to-red-800 active:scale-95 hover:shadow-lg'
                      }`}
                    >
                      <div className="text-left flex items-center gap-3">
                        <IconAlertCircle className="w-6 h-6 opacity-80" />
                        <div>
                          <p className="font-extrabold text-xs">CATAT ALFA / TANPA KETERANGAN</p>
                          <p className="text-[10px] text-rose-100">
                            {todayAbsensi.alfa ? 'Telah Dicatat Alfa Hari Ini' : 'Klik untuk Input Keterangan Alfa'}
                          </p>
                        </div>
                      </div>
                      <span className="bg-white text-rose-800 text-[11px] font-bold px-2.5 py-1 rounded-xl shadow-sm">
                        {todayAbsensi.alfa ? 'ALFA' : 'INPUT'}
                      </span>
                    </button>
                  </div>

                </div>
              )}

              {/* TAB REKAPITULASI PRESENSI */}
              {activeTab === 'rekap' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-slate-800">Rekapitulasi Presensi</h2>
                      <p className="text-xs text-slate-500">SMP IT NU Asshofiyah ({filteredLogs.length} Catatan)</p>
                    </div>
                    
                    <div className="flex gap-1.5">
                      <button
                        onClick={handleOpenPdfPreview}
                        className="bg-emerald-700 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1 shadow-sm hover:bg-emerald-800"
                      >
                        <IconEye className="w-3.5 h-3.5" /> Pratinjau PDF
                      </button>
                    </div>
                  </div>

                  {/* Filter Bulan & Tahun */}
                  <div className="bg-white p-3 rounded-2xl border border-slate-200 grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">PILIH BULAN</label>
                      <select
                        value={selectedMonth}
                        onChange={(e) => { setSelectedMonth(e.target.value); setDisplayLimit(25); }}
                        className="w-full p-2 border border-slate-300 rounded-xl font-semibold bg-slate-50"
                      >
                        <option value="01">Januari</option>
                        <option value="02">Februari</option>
                        <option value="03">Maret</option>
                        <option value="04">April</option>
                        <option value="05">Mei</option>
                        <option value="06">Juni</option>
                        <option value="07">Juli</option>
                        <option value="08">Agustus</option>
                        <option value="09">September</option>
                        <option value="10">Oktober</option>
                        <option value="11">November</option>
                        <option value="12">Desember</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] text-slate-400 font-bold block mb-1">PILIH TAHUN</label>
                      <select
                        value={selectedYear}
                        onChange={(e) => { setSelectedYear(e.target.value); setDisplayLimit(25); }}
                        className="w-full p-2 border border-slate-300 rounded-xl font-semibold bg-slate-50"
                      >
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                      </select>
                    </div>
                  </div>

                  {/* Card Statistik Bulanan */}
                  <div className="grid grid-cols-4 gap-1.5 text-center">
                    <div className="bg-white p-2.5 rounded-2xl border border-slate-200">
                      <p className="text-[9px] text-slate-400 font-bold">TOTAL HADIR</p>
                      <p className="text-lg font-black text-emerald-600 my-0.5">{stats.totalHadir}</p>
                      <p className="text-[8px] text-slate-400">Hari</p>
                    </div>
                    <div className="bg-white p-2.5 rounded-2xl border border-slate-200">
                      <p className="text-[9px] text-slate-400 font-bold">TERLAMBAT</p>
                      <p className="text-lg font-black text-amber-500 my-0.5">{stats.totalTerlambat}</p>
                      <p className="text-[8px] text-slate-400">Kali</p>
                    </div>
                    <div className="bg-white p-2.5 rounded-2xl border border-slate-200">
                      <p className="text-[9px] text-slate-400 font-bold">DINAS LUAR</p>
                      <p className="text-lg font-black text-teal-600 my-0.5">{stats.totalDinas}</p>
                      <p className="text-[8px] text-slate-400">Kegiatan</p>
                    </div>
                    <div className="bg-white p-2.5 rounded-2xl border border-slate-200">
                      <p className="text-[9px] text-slate-400 font-bold">TOTAL ALFA</p>
                      <p className="text-lg font-black text-rose-600 my-0.5">{stats.totalAlfa}</p>
                      <p className="text-[8px] text-slate-400">Hari</p>
                    </div>
                  </div>

                  {/* List Riwayat Presensi */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <h3 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Rincian Kehadiran Guru</h3>
                    
                    {filteredLogs.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-6">Tidak ada catatan presensi pada bulan ini.</p>
                    ) : (
                      <div className="space-y-2.5">
                        {displayedLogs.map(log => (
                          <div key={log.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs flex justify-between items-start">
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-slate-800">{log.tanggal}</span>
                                <span className="text-[9px] px-2 py-0.5 bg-slate-200 font-semibold rounded">{log.tipe}</span>
                              </div>
                              <p className="text-slate-600 font-mono">
                                Jam: <strong className="text-slate-800">{log.datang}</strong> s/d <strong className="text-slate-800">{log.pulang}</strong>
                              </p>
                              <p className="text-[10px] text-slate-500 italic">{log.keterangan}</p>
                            </div>

                            <div className="flex flex-col items-end gap-2">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                log.status.includes('Tepat') ? 'bg-emerald-100 text-emerald-800' :
                                log.status.includes('Terlambat') ? 'bg-amber-100 text-amber-800' :
                                log.status.includes('Alfa') ? 'bg-rose-100 text-rose-800' :
                                'bg-teal-100 text-teal-800'
                              }`}>
                                {log.status}
                              </span>
                              <button
                                onClick={() => setDeleteTargetId(log.id)}
                                className="text-rose-500 hover:text-rose-700 p-1"
                                title="Hapus Catatan"
                              >
                                <IconTrash className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}

                        {filteredLogs.length > displayLimit && (
                          <button
                            onClick={() => setDisplayLimit(prev => prev + 25)}
                            className="w-full py-2 bg-slate-100 text-slate-600 border border-slate-300 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all"
                          >
                            Tampilkan Lebih Banyak ({filteredLogs.length - displayLimit} tersisa)
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB PROFIL GURU & DATABASE CLOUD */}
              {activeTab === 'profile' && (
                <div className="space-y-4">
                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Identitas Data Diri Guru</h3>
                      <span className="text-[10px] bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
                        <IconLock className="w-3 h-3 text-emerald-600" /> Terikat HP Ini
                      </span>
                    </div>
                    
                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between py-1.5 border-b">
                        <span className="text-slate-500">Nama Lengkap:</span>
                        <span className="font-bold text-slate-800">{userProfile.nama || '-'}</span>
                      </div>
                      <div className="flex justify-between py-1.5 border-b">
                        <span className="text-slate-500">NIP / NUPTK:</span>
                        <span className="font-mono font-bold text-slate-800">{userProfile.nip || '-'}</span>
                      </div>
                      <div className="flex justify-between py-1.5 border-b">
                        <span className="text-slate-500">Jabatan:</span>
                        <span className="font-bold text-slate-800">{userProfile.jabatan}</span>
                      </div>
                      <div className="flex justify-between py-1.5 border-b">
                        <span className="text-slate-500">Unit Kerja:</span>
                        <span className="font-bold text-emerald-800">{KONFIGURASI_SEKOLAH.NAMA_SEKOLAH}</span>
                      </div>
                      <div className="flex justify-between py-1.5 border-b">
                        <span className="text-slate-500">Status PNS:</span>
                        <span className="font-bold text-emerald-700">{userProfile.statusPNS}</span>
                      </div>
                      <div className="flex justify-between py-1.5">
                        <span className="text-slate-500">Device ID Terikat:</span>
                        <span className="font-mono font-bold text-emerald-800">{deviceId}</span>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        setEditFormData({ ...userProfile });
                        setIsEditModalOpen(true);
                      }}
                      className="w-full py-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1 hover:bg-emerald-100"
                    >
                      <IconEdit className="w-4 h-4" /> Edit Profil Guru
                    </button>
                  </div>

                  {/* SINKRONISASI GOOGLE SHEETS */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <h3 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Integrasi Database Cloud</h3>
                    <div className="space-y-2 text-xs">
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold block mb-1">URL GOOGLE APPS SCRIPT WEB APP</label>
                        <input
                          type="url"
                          placeholder="https://script.google.com/macros/s/.../exec"
                          value={webAppUrl}
                          onChange={(e) => {
                            setWebAppUrl(e.target.value);
                            localStorage.setItem('teacher_gas_webapp_url', e.target.value);
                          }}
                          className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-[11px]"
                        />
                      </div>

                      <div className="flex gap-2 pt-1">
                        <button
                          onClick={() => syncWithCloud('saveAll')}
                          disabled={isSyncingCloud || !webAppUrl}
                          className="flex-1 py-2 bg-emerald-700 text-white rounded-xl font-bold flex items-center justify-center gap-1 hover:bg-emerald-800"
                        >
                          <IconUpload className="w-4 h-4" /> Upload Sync
                        </button>

                        <button
                          onClick={pullDataFromCloud}
                          disabled={isSyncingCloud || !webAppUrl}
                          className="flex-1 py-2 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-1 hover:bg-slate-900"
                        >
                          <IconRefresh className="w-4 h-4" /> Tarik Data
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* RESET DATA LOKAL */}
                  <div className="pt-2">
                    <button
                      onClick={() => setIsResetConfirmOpen(true)}
                      className="w-full py-2.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1"
                    >
                      <IconTrash className="w-4 h-4" /> Reset Seluruh Data Lokal HP
                    </button>
                  </div>
                </div>
              )}

            </div>

            {/* NAVIGATION BAR BOTTOM */}
            <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-40 no-print shadow-lg">
              <button
                onClick={() => setActiveTab('home')}
                className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}
              >
                <IconClock className="w-5 h-5" />
                <span className="text-[10px]">Absen</span>
              </button>

              <button
                onClick={() => setActiveTab('rekap')}
                className={`flex flex-col items-center gap-1 ${activeTab === 'rekap' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}
              >
                <IconCalendar className="w-5 h-5" />
                <span className="text-[10px]">Rekap</span>
              </button>

              <button
                onClick={() => setActiveTab('profile')}
                className={`flex flex-col items-center gap-1 ${activeTab === 'profile' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}
              >
                <IconUser className="w-5 h-5" />
                <span className="text-[10px]">Profil</span>
              </button>
            </div>

            {/* MODAL EDIT PROFIL GURU */}
            {isEditModalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-base text-slate-800">Edit Profil Guru</h3>
                    <button onClick={() => setIsEditModalOpen(false)} className="text-slate-400 font-bold">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveProfileSubmit} className="space-y-3 text-xs">
                    <div className="flex flex-col items-center gap-2">
                      <div className="w-20 h-20 rounded-full bg-emerald-50 border-2 border-emerald-600 overflow-hidden flex items-center justify-center relative">
                        {editFormData.foto ? (
                          <img src={editFormData.foto} alt="Foto Profil" className="w-full h-full object-cover" />
                        ) : (
                          <LogoSchoolEmblem className="w-12 h-12" />
                        )}
                      </div>

                      <input
                        type="file"
                        ref={fileInputRef}
                        accept="image/jpeg, image/jpg, image/png, image/*"
                        onChange={handleImageUpload}
                        className="hidden"
                      />

                      <button
                        type="button"
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                        className="px-3 py-1 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg text-[11px] font-semibold flex items-center gap-1"
                      >
                        <IconUpload className="w-3.5 h-3.5" /> Pilih Foto Kamera / Galeri
                      </button>
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Nama Lengkap & Gelar</label>
                      <input
                        type="text"
                        required
                        placeholder="Contoh: Ahmad Fauzi, S.Pd.I"
                        value={editFormData.nama}
                        onChange={(e) => setEditFormData({ ...editFormData, nama: e.target.value })}
                        className="w-full p-2.5 border rounded-xl"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-bold block">NIP / NUPTK</label>
                        {userProfile.nip && (
                          <span className="text-[10px] text-amber-600 font-semibold flex items-center gap-0.5">
                            <IconLock className="w-3 h-3" /> Terkunci Perangkat
                          </span>
                        )}
                      </div>
                      <input
                        type="text"
                        required
                        readOnly={!!userProfile.nip}
                        placeholder="Contoh: 19880412 201503 1 004"
                        value={editFormData.nip}
                        onChange={(e) => setEditFormData({ ...editFormData, nip: e.target.value })}
                        className={`w-full p-2.5 border rounded-xl font-mono ${
                          userProfile.nip ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white'
                        }`}
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Jabatan / Mapel</label>
                      <input
                        type="text"
                        required
                        value={editFormData.jabatan}
                        onChange={(e) => setEditFormData({ ...editFormData, jabatan: e.target.value })}
                        className="w-full p-2.5 border rounded-xl"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Unit Kerja / Sekolah</label>
                      <input
                        type="text"
                        required
                        readOnly
                        value={KONFIGURASI_SEKOLAH.NAMA_SEKOLAH}
                        className="w-full p-2.5 border rounded-xl bg-slate-100 font-bold text-emerald-800"
                      />
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="w-1/3 py-2.5 border rounded-xl text-xs font-semibold"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="w-2/3 py-2.5 bg-emerald-700 text-white rounded-xl text-xs font-bold hover:bg-emerald-800"
                      >
                        Simpan Perubahan
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL PIN KEAMANAN JADWAL */}
            {isPinModalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-xs rounded-3xl p-5 space-y-4 text-center">
                  <div className="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto">
                    <IconLock className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-slate-800">PIN Keamanan Jadwal</h3>
                    <p className="text-xs text-slate-500 mt-0.5">Masukkan PIN untuk mengedit jam operasional</p>
                  </div>

                  <form onSubmit={handleVerifyPinAndOpenSchedule} className="space-y-3">
                    <input
                      type="password"
                      maxLength={6}
                      autoFocus
                      placeholder="Default PIN: 1234"
                      value={enteredPin}
                      onChange={(e) => setEnteredPin(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-center text-lg font-mono tracking-widest"
                    />
                    {pinError && <p className="text-xs text-rose-500 font-bold">{pinError}</p>}

                    <div className="flex gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => setIsPinModalOpen(false)}
                        className="w-1/2 py-2 border rounded-xl text-xs font-semibold"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="w-1/2 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold"
                      >
                        Verifikasi
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL EDIT JADWAL OPERASIONAL */}
            {isScheduleModalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-base text-slate-800">Atur Jam Operasional</h3>
                    <button onClick={() => setIsScheduleModalOpen(false)} className="text-slate-400 font-bold">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveScheduleSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Toleransi Keterlambatan (Menit)</label>
                      <input
                        type="number"
                        min="0"
                        max="60"
                        value={editScheduleData.toleransiMenit || 10}
                        onChange={(e) => setEditScheduleData({ ...editScheduleData, toleransiMenit: Number(e.target.value) })}
                        className="w-full p-2 border rounded-xl font-mono"
                      />
                    </div>

                    <div className="space-y-2 pt-2 border-t">
                      {[1, 2, 3, 4, 5, 6, 0].map(dayKey => {
                        const dayObj = editScheduleData[dayKey] || { dayName: '', masuk: '07:00', pulang: '15:30', isLibur: false };
                        return (
                          <div key={dayKey} className="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                            <div className="w-20">
                              <p className="font-bold text-slate-700">{dayObj.dayName}</p>
                              <label className="flex items-center gap-1 mt-1 text-[10px] text-slate-500">
                                <input
                                  type="checkbox"
                                  checked={dayObj.isLibur}
                                  onChange={(e) => setEditScheduleData({
                                    ...editScheduleData,
                                    [dayKey]: { ...dayObj, isLibur: e.target.checked }
                                  })}
                                /> Libur
                              </label>
                            </div>

                            {!dayObj.isLibur ? (
                              <div className="flex items-center gap-1.5 font-mono">
                                <input
                                  type="time"
                                  value={dayObj.masuk}
                                  onChange={(e) => setEditScheduleData({
                                    ...editScheduleData,
                                    [dayKey]: { ...dayObj, masuk: e.target.value }
                                  })}
                                  className="p-1 border rounded bg-white"
                                />
                                <span>-</span>
                                <input
                                  type="time"
                                  value={dayObj.pulang}
                                  onChange={(e) => setEditScheduleData({
                                    ...editScheduleData,
                                    [dayKey]: { ...dayObj, pulang: e.target.value }
                                  })}
                                  className="p-1 border rounded bg-white"
                                />
                              </div>
                            ) : (
                              <span className="text-slate-400 font-bold italic text-[11px]">Hari Libur</span>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsScheduleModalOpen(false)}
                        className="w-1/3 py-2.5 border rounded-xl text-xs font-semibold"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="w-2/3 py-2.5 bg-emerald-700 text-white rounded-xl text-xs font-bold"
                      >
                        Simpan Jam Operasional
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL ABSEN DINAS LUAR */}
            {isDinasModalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-base text-slate-800">
                      Absen {dinasType === 'datang' ? 'Kedatangan Dinas' : 'Kepulangan Dinas'}
                    </h3>
                    <button onClick={() => setIsDinasModalOpen(false)} className="text-slate-400 font-bold">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                    <button
                      type="button"
                      onClick={() => {
                        setDinasType('datang');
                        const nowStr = currentTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
                        setDinasTime(nowStr);
                      }}
                      className={`flex-1 py-1.5 rounded-lg transition-all ${dinasType === 'datang' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600'}`}
                    >
                      Dinas Kedatangan
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setDinasType('pulang');
                        const nowStr = currentTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
                        setDinasTime(nowStr);
                      }}
                      className={`flex-1 py-1.5 rounded-lg transition-all ${dinasType === 'pulang' ? 'bg-orange-600 text-white shadow-sm' : 'text-slate-600'}`}
                    >
                      Dinas Kepulangan
                    </button>
                  </div>

                  <form onSubmit={handleSubmitDinas} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Tujuan / Nama Kegiatan Dinas</label>
                      <input
                        type="text"
                        required
                        placeholder="Contoh: MGMP IPA Kabupaten Cirebon"
                        value={dinasPurpose}
                        onChange={(e) => setDinasPurpose(e.target.value)}
                        className="w-full text-xs p-2.5 border border-slate-300 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Nomor Surat Tugas (ST)</label>
                      <input
                        type="text"
                        placeholder="Contoh: 421/045/SMPIT-NU/2026"
                        value={dinasLetterNo}
                        onChange={(e) => setDinasLetterNo(e.target.value)}
                        className="w-full text-xs p-2.5 border border-slate-300 rounded-xl font-mono"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">
                        Jam {dinasType === 'datang' ? 'Kedatangan' : 'Kepulangan'} Dinas
                      </label>
                      <input
                        type="time"
                        required
                        value={dinasTime}
                        onChange={(e) => setDinasTime(e.target.value)}
                        className="w-full text-xs p-2.5 border border-slate-300 rounded-xl bg-slate-50 font-mono"
                      />
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsDinasModalOpen(false)}
                        className="w-1/3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold text-slate-600"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className={`w-2/3 py-2.5 text-white rounded-xl text-xs font-bold ${
                          dinasType === 'datang' ? 'bg-amber-600' : 'bg-orange-600'
                        }`}
                      >
                        Klik Absen {dinasType === 'datang' ? 'Dinas Datang' : 'Dinas Pulang'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL INPUT ALFA */}
            {isAlfaModalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <div className="flex items-center gap-2 text-rose-600">
                      <IconAlertCircle className="w-5 h-5" />
                      <h3 className="font-bold text-base text-slate-800">Catat Alfa / Tanpa Keterangan</h3>
                    </div>
                    <button onClick={() => setIsAlfaModalOpen(false)} className="text-slate-400 font-bold">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSubmitAlfa} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Alasan / Keterangan Alfa</label>
                      <textarea
                        rows="3"
                        placeholder="Contoh: Urusan Keluarga Mendesak / Sakit Tanpa Surat / Tanpa Keterangan Resmi"
                        value={alfaReason}
                        onChange={(e) => setAlfaReason(e.target.value)}
                        className="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-500 focus:outline-none"
                      ></textarea>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsAlfaModalOpen(false)}
                        className="w-1/3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold text-slate-600"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="w-2/3 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold"
                      >
                        Simpan Status Alfa
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL CONFIRM DELETE & RESET */}
            {deleteTargetId && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-xs rounded-3xl p-5 space-y-3 text-center">
                  <h3 className="font-bold text-base text-slate-800">Hapus Catatan Presensi?</h3>
                  <p className="text-xs text-slate-500">Catatan ini akan dihapus dari riwayat lokal dan Cloud.</p>
                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setDeleteTargetId(null)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Batal</button>
                    <button onClick={handleExecuteDeleteLog} className="flex-1 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">Hapus</button>
                  </div>
                </div>
              </div>
            )}

            {isResetConfirmOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-xs rounded-3xl p-5 space-y-3 text-center">
                  <h3 className="font-bold text-base text-slate-800">Reset Seluruh Data?</h3>
                  <p className="text-xs text-slate-500">Semua riwayat dan pengaturan lokal akan di-reset.</p>
                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setIsResetConfirmOpen(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Batal</button>
                    <button onClick={() => {
                      localStorage.clear();
                      window.location.reload();
                    }} className="flex-1 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">Reset</button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL PRATINJAU DOKUMEN PDF A4 DENGAN KOP RESMI SMP IT NU ASSHOFIYAH */}
            {isPreviewPdfModalOpen && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col p-2 sm:p-4 overflow-y-auto">
                <div className="bg-slate-900 text-white p-3 rounded-t-2xl flex justify-between items-center max-w-3xl mx-auto w-full border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setIsPreviewPdfModalOpen(false)}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 border border-slate-700 transition-all"
                      title="Kembali ke Aplikasi"
                    >
                      <IconX className="w-4 h-4 text-rose-400" />
                      <span>Kembali / Tutup</span>
                    </button>
                    <div className="h-4 w-px bg-slate-700 mx-1 hidden sm:block"></div>
                    <IconEye className="w-5 h-5 text-emerald-400 hidden sm:block" />
                    <h3 className="font-bold text-xs sm:text-sm hidden sm:block">Pratinjau Laporan PDF (A4)</h3>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleDownloadPdfFile}
                      disabled={isGeneratingPdf}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition-all"
                    >
                      <IconDownload className="w-3.5 h-3.5" />
                      {isGeneratingPdf ? 'Memproses...' : 'Unduh PDF'}
                    </button>
                    <button
                      onClick={() => setIsPreviewPdfModalOpen(false)}
                      className="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 p-1.5 rounded-xl border border-rose-500/30 transition-all"
                    >
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                <div className="bg-slate-800 p-3 sm:p-6 overflow-x-auto flex-1 max-w-3xl mx-auto w-full rounded-b-2xl shadow-2xl">
                  {/* Container Lembar Kertas PDF A4 */}
                  <div
                    id="pdf-printable-content"
                    style={{
                      width: '680px',
                      boxSizing: 'border-box',
                      padding: '24px',
                      background: '#ffffff',
                      color: '#000000',
                      fontFamily: 'Arial, Helvetica, sans-serif',
                      margin: '0 auto',
                      lineHeight: '1.4',
                      borderRadius: '4px',
                      boxShadow: '0 10px 25px -5px rgba(0, 0, 0, 0.3)'
                    }}
                  >
                    {/* Kop Surat Resmi SMP IT NU Asshofiyah */}
                    <table style={{ width: '100%', borderBottom: '3px double #047857', paddingBottom: '8px', marginBottom: '14px' }}>
                      <tbody>
                        <tr>
                          <td style={{ width: '70px', verticalAlign: 'middle', textAlign: 'center' }}>
                            <div style={{ width: '60px', height: '60px', margin: '0 auto' }}>
                              <LogoSchoolEmblem className="w-full h-full" />
                            </div>
                          </td>
                          <td style={{ textAlign: 'center', verticalAlign: 'middle' }}>
                            <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 2px 0', textTransform: 'uppercase', color: '#047857', letterSpacing: '0.5px' }}>
                              SMP IT NU ASSHOFIYAH
                            </h2>
                            <p style={{ fontSize: '10px', fontWeight: 'bold', margin: '0 0 2px 0', color: '#333333', textTransform: 'uppercase' }}>
                              BALAD - DUKUPUNTANG - CIREBON
                            </p>
                            <p style={{ fontSize: '9px', margin: '0', color: '#666666', fontStyle: 'italic' }}>
                              Alamat: Desa Balad, Kecamatan Dukupuntang, Kabupaten Cirebon, Jawa Barat
                            </p>
                            <h3 style={{ fontSize: '11px', fontWeight: 'bold', margin: '6px 0 0 0', textTransform: 'uppercase', color: '#000000', borderTop: '1px solid #e2e8f0', paddingTop: '4px' }}>
                              LAPORAN KEHADIRAN GURU & TENAGA KEPENDIDIKAN
                            </h3>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                    {/* Metadata Guru */}
                    <table style={{ width: '100%', fontSize: '10px', marginBottom: '12px', borderCollapse: 'collapse', color: '#000000', tableLayout: 'fixed' }}>
                      <tbody>
                        <tr>
                          <td style={{ width: '18%', fontWeight: 'bold', padding: '3px 0' }}>Nama Lengkap</td>
                          <td style={{ width: '2%', textAlign: 'center' }}>:</td>
                          <td style={{ width: '30%', padding: '3px 0', wordBreak: 'break-word' }}>{userProfile.nama || '-'}</td>
                          <td style={{ width: '18%', fontWeight: 'bold', padding: '3px 0' }}>Bulan / Tahun</td>
                          <td style={{ width: '2%', textAlign: 'center' }}>:</td>
                          <td style={{ width: '30%', padding: '3px 0', wordBreak: 'break-word' }}>{selectedMonth} / {selectedYear}</td>
                        </tr>
                        <tr>
                          <td style={{ fontWeight: 'bold', padding: '3px 0' }}>NIP / NUPTK</td>
                          <td style={{ textAlign: 'center' }}>:</td>
                          <td style={{ padding: '3px 0', wordBreak: 'break-word' }}>{userProfile.nip || '-'}</td>
                          <td style={{ fontWeight: 'bold', padding: '3px 0' }}>Jabatan / Mapel</td>
                          <td style={{ textAlign: 'center' }}>:</td>
                          <td style={{ padding: '3px 0', wordBreak: 'break-word' }}>{userProfile.jabatan}</td>
                        </tr>
                      </tbody>
                    </table>

                    {/* Tabel Riwayat Kehadiran */}
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '9px', marginBottom: '16px', tableLayout: 'fixed', color: '#000000' }}>
                      <thead>
                        <tr style={{ background: '#d1fae5', color: '#065f46' }}>
                          <th style={{ border: '1px solid #047857', padding: '6px 4px', width: '5%', textAlign: 'center', fontWeight: 'bold' }}>No</th>
                          <th style={{ border: '1px solid #047857', padding: '6px 4px', width: '15%', textAlign: 'center', fontWeight: 'bold' }}>Tanggal</th>
                          <th style={{ border: '1px solid #047857', padding: '6px 4px', width: '12%', textAlign: 'center', fontWeight: 'bold' }}>Datang</th>
                          <th style={{ border: '1px solid #047857', padding: '6px 4px', width: '12%', textAlign: 'center', fontWeight: 'bold' }}>Pulang</th>
                          <th style={{ border: '1px solid #047857', padding: '6px 4px', width: '16%', textAlign: 'center', fontWeight: 'bold' }}>Status</th>
                          <th style={{ border: '1px solid #047857', padding: '6px 5px', width: '40%', textAlign: 'left', fontWeight: 'bold' }}>Keterangan / Lokasi</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredLogs.length === 0 ? (
                          <tr>
                            <td colSpan="6" style={{ border: '1px solid #000000', padding: '14px', textAlign: 'center', fontStyle: 'italic', color: '#666666' }}>
                              Tidak ada catatan data presensi pada periode bulan ini.
                            </td>
                          </tr>
                        ) : (
                          filteredLogs.map((log, idx) => (
                            <tr key={log.id} style={{ pageBreakInside: 'avoid', breakInside: 'avoid', background: idx % 2 === 1 ? '#f8fafc' : '#ffffff' }}>
                              <td style={{ border: '1px solid #000000', padding: '5px 4px', textAlign: 'center', wordBreak: 'break-word' }}>{idx + 1}</td>
                              <td style={{ border: '1px solid #000000', padding: '5px 4px', textAlign: 'center', wordBreak: 'break-word' }}>{log.tanggal}</td>
                              <td style={{ border: '1px solid #000000', padding: '5px 4px', textAlign: 'center', wordBreak: 'break-word' }}>{log.datang}</td>
                              <td style={{ border: '1px solid #000000', padding: '5px 4px', textAlign: 'center', wordBreak: 'break-word' }}>{log.pulang}</td>
                              <td style={{ border: '1px solid #000000', padding: '5px 4px', textAlign: 'center', wordBreak: 'break-word', fontWeight: 'bold' }}>{log.status}</td>
                              <td style={{ border: '1px solid #000000', padding: '5px 5px', wordBreak: 'break-word', overflowWrap: 'anywhere', whiteSpace: 'normal', lineHeight: '1.3' }}>
                                {log.keterangan} {log.lokasi ? `(${log.lokasi})` : ''}
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>

                    {/* Ringkasan & Tanda Tangan */}
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '9px', marginTop: '16px', pageBreakInside: 'avoid', breakInside: 'avoid' }}>
                      <tbody>
                        <tr>
                          {/* Box Rekapitulasi Hari */}
                          <td style={{ width: '38%', verticalAlign: 'top', paddingRight: '10px' }}>
                            <div style={{ border: '1px solid #047857', padding: '8px 10px', background: '#ecfdf5', borderRadius: '4px' }}>
                              <p style={{ fontWeight: 'bold', margin: '0 0 6px 0', textTransform: 'uppercase', fontSize: '9px', borderBottom: '1px solid #047857', paddingBottom: '3px', color: '#065f46' }}>
                                REKAPITULASI KEHADIRAN
                              </p>
                              <p style={{ margin: '3px 0' }}>• Total Kehadiran: <strong>{stats.totalHadir} Hari</strong></p>
                              <p style={{ margin: '3px 0' }}>• Terlambat: <strong>{stats.totalTerlambat} Kali</strong></p>
                              <p style={{ margin: '3px 0' }}>• Dinas Luar: <strong>{stats.totalDinas} Kegiatan</strong></p>
                              <p style={{ margin: '3px 0' }}>• Alfa / Tanpa Ket: <strong>{stats.totalAlfa} Hari</strong></p>
                            </div>
                          </td>

                          {/* Tanda Tangan Kepala Sekolah */}
                          <td style={{ width: '31%', textAlign: 'center', verticalAlign: 'top', padding: '0 5px' }}>
                            <p style={{ margin: '0 0 44px 0', lineHeight: '1.3' }}>
                              Mengetahui,<br />
                              <strong>Kepala SMP IT NU Asshofiyah</strong>
                            </p>
                            <p style={{ margin: '0', textDecoration: 'underline', fontWeight: 'bold' }}>
                              _________________________
                            </p>
                            <p style={{ margin: '3px 0 0 0', fontSize: '8px', color: '#333333' }}>NIP. ........................................</p>
                          </td>

                          {/* Tanda Tangan Guru */}
                          <td style={{ width: '31%', textAlign: 'center', verticalAlign: 'top', paddingLeft: '5px' }}>
                            <p style={{ margin: '0 0 44px 0', lineHeight: '1.3' }}>
                              Dukupuntang, {new Date().getDate()} {['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][new Date().getMonth()]} {new Date().getFullYear()}<br />
                              Guru / Pegawai Bersangkutan,
                            </p>
                            <p style={{ margin: '0', textDecoration: 'underline', fontWeight: 'bold' }}>
                              {userProfile.nama || '........................................'}
                            </p>
                            <p style={{ margin: '3px 0 0 0', fontSize: '8px', color: '#333333' }}>NIP. {userProfile.nip || '....................'}</p>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                  </div>

                  {/* Navigasi Aksi Bawah Modal */}
                  <div className="mt-4 pt-3 border-t border-slate-700 flex justify-between items-center no-print">
                    <button
                      onClick={() => setIsPreviewPdfModalOpen(false)}
                      className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm border border-slate-600"
                    >
                      <IconX className="w-4 h-4 text-rose-400" />
                      <span>Tutup / Kembali ke Aplikasi</span>
                    </button>

                    <button
                      onClick={handleDownloadPdfFile}
                      disabled={isGeneratingPdf}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow-md transition-all"
                    >
                      <IconDownload className="w-4 h-4" />
                      {isGeneratingPdf ? 'Memproses File...' : 'Unduh File PDF (A4)'}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
